<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found | SolomindLM</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        background: #f7f5ef;
        color: #20211f;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(32rem, calc(100% - 3rem));
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        line-height: 1;
      }

      p {
        margin: 0 0 1.75rem;
        font-size: 1.1rem;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        border-radius: 0.5rem;
        background: #20211f;
        color: #fff;
        padding: 0.7rem 1rem;
        text-decoration: none;
      }

      a:hover {
        background: #3a3b37;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>The page you requested does not exist or may have moved.</p>
      <a href="/">Return to SolomindLM</a>
    </main>
  </body>
</html>
