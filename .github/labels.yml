# Canonical label taxonomy. Synced to GitHub by .github/workflows/labels.yml
# (EndBug/label-sync). Pre-existing labels not listed here are left untouched
# (delete-other-labels defaults to false).
#
# Every issue should carry exactly one label from each of: type, area, priority,
# status. See .github/BRANCHING.md ("Issues") for the triage process.

# ── type ─────────────────────────────────────────────────────────────────────
- name: "type:bug"
  color: "d73a4a"
  description: "Something is broken or behaving unexpectedly"
- name: "type:feature"
  color: "0e8a16"
  description: "New capability or change to existing behavior"
- name: "type:refactor"
  color: "5319e7"
  description: "Internal cleanup, no user-facing change"
- name: "type:chore"
  color: "fef2c0"
  description: "Maintenance, tooling, config"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type:test"
  color: "c5def5"
  description: "Test coverage or test infrastructure"
- name: "type:perf"
  color: "fbca04"
  description: "Performance or cost"

# ── area ─────────────────────────────────────────────────────────────────────
- name: "area:web"
  color: "1d76db"
  description: "apps/web"
- name: "area:mobile"
  color: "1d76db"
  description: "apps/mobile"
- name: "area:convex"
  color: "1d76db"
  description: "convex/ backend, schema, functions"
- name: "area:agents"
  color: "1d76db"
  description: "convex/_agents LangGraph agents"
- name: "area:rag"
  color: "1d76db"
  description: "Retrieval, embeddings, reranking, RAG evals"
- name: "area:studio"
  color: "1d76db"
  description: "Studio content generation (reports, flashcards, quizzes, …)"
- name: "area:billing"
  color: "1d76db"
  description: "Stripe, subscriptions, entitlement gating"
- name: "area:auth"
  color: "1d76db"
  description: "Authentication and authorization"
- name: "area:sources"
  color: "1d76db"
  description: "Paper import, extraction, academic discovery"
- name: "area:chat"
  color: "1d76db"
  description: "Chat, deep research, literature review"
- name: "area:ci"
  color: "1d76db"
  description: "CI/CD, infra, repo tooling"

# ── priority ─────────────────────────────────────────────────────────────────
- name: "priority:p0"
  color: "b60205"
  description: "Broken in production — drop everything"
- name: "priority:p1"
  color: "d93f0b"
  description: "Address this cycle"
- name: "priority:p2"
  color: "fbca04"
  description: "Soon, not urgent"
- name: "priority:p3"
  color: "0e8a16"
  description: "Someday / nice to have"

# ── status ───────────────────────────────────────────────────────────────────
- name: "status:triage"
  color: "ededed"
  description: "Not yet triaged — needs priority + area + milestone or close"
- name: "status:ready"
  color: "c2e0c6"
  description: "Triaged and ready to pick up"
- name: "status:in-progress"
  color: "fbca04"
  description: "Someone is actively working on this"
- name: "status:blocked"
  color: "b60205"
  description: "Waiting on something external"
- name: "status:needs-design"
  color: "d876e3"
  description: "Needs a design or product decision before work starts"
- name: "status:needs-repro"
  color: "e99695"
  description: "Cannot reproduce — waiting for more info"
- name: "status:stale"
  color: "cccccc"
  description: "No activity for 60 days — will close if untouched"

# ── misc ─────────────────────────────────────────────────────────────────────
- name: "breaking-change"
  color: "b60205"
  description: "Requires a migration or coordinated deploy"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "security"
  color: "ee0701"
  description: "Security-relevant"
- name: "dependencies"
  color: "0366d6"
  description: "Dependency updates (Renovate)"
