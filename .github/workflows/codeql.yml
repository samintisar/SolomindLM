# CodeQL JS/TS static analysis (advanced setup — workflow-driven, not default setup)
# so analysis can be scoped with paths-ignore: .worktrees/ holds full checkouts of
# other branches and must never be scanned. JS/TS is an interpreted language, so
# build-mode is "none" and there is no Autobuild step. Findings surface under
# Security > Code scanning. Weekly schedule catches advisories on untouched code.
# Repo Settings > Code security > Code scanning must stay on "Advanced" (workflow) —
# if "Default setup" is enabled there, these advanced-config runs fail to process.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths-ignore:
              - convex/_generated
              - .worktrees
              - apps/mobile
              - docs
              - "**/*.test.ts"
              - "**/*.test.tsx"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
