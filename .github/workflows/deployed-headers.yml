# After Vercel finishes a deployment, request a few paths from it and fail if the security
# headers from apps/web/vercel.json are missing or routing changed (pages 200, unknown path
# 404). The CSP smoke test serves the build with headers read from vercel.json itself, so it
# can't see Vercel silently ignoring them; this job can.
#
# Vercel's GitHub integration posts a deployment_status for every Production and Preview
# deployment. Both are checked on the deployment's own URL (environment_url), not on
# www.solomindlm.com: Cloudflare sits in front of the custom domain, answers GitHub's runners
# with a 403 challenge, and can serve a cached copy of a static file from before a headers
# change. Neither says anything about what Vercel sends. The deployment URL is also the exact
# commit that was deployed, not whatever is live by the time the job runs.
#
# Deployment URLs (production ones too) are behind Deployment Protection, so the job needs
# VERCEL_AUTOMATION_BYPASS_SECRET (Vercel → Project Settings → Deployment Protection →
# Protection Bypass for Automation). It is a secret of the `vercel-preview-bypass` GitHub
# Environment, not a repo secret; the name predates production using it too (indexnow.yml
# shares it). deployment_status runs the workflow file from the deployed commit, so a branch
# could edit this file; an environment secret is only released to jobs that pass the
# environment's protection rules (add required reviewers there if fork deployments are ever
# authorized in Vercel). Without the secret the job warns and skips. The checker runs from
# main and only parses the deployed commit's vercel.json, and the script refuses to send the
# secret anywhere but HTTPS on this project's hosts.
#
# Advisory: a deployment_status run is not attached to the PR's required checks.

name: Deployed headers

on:
  deployment_status:

permissions:
  contents: read

jobs:
  deployment:
    name: Deployed security headers (${{ github.event.deployment.environment }})
    if: >-
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Production' || github.event.deployment.environment == 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: vercel-preview-bypass
    steps:
      - name: Check for bypass secret
        id: secret
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET}" ]; then
            echo "::warning::VERCEL_AUTOMATION_BYPASS_SECRET is not set on the vercel-preview-bypass environment; protected deployments can't be checked. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main (trusted checker)
        if: steps.secret.outputs.run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download the deployed commit's vercel.json
        id: config
        if: steps.secret.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          if [ ! -f e2e/csp/check-deployed-headers.ts ]; then
            echo "::notice::main has no e2e/csp/check-deployed-headers.ts yet. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/${REPO}/contents/apps/web/vercel.json?ref=${SHA}" -H "Accept: application/vnd.github.raw" > "${RUNNER_TEMP}/vercel.json"
          echo "run=true" >> "$GITHUB_OUTPUT"

      # The check only uses node: built-ins, so no dependency install.
      - name: Setup Bun
        if: steps.config.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Check headers and routing
        if: steps.config.outputs.run == 'true'
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_JSON: ${{ runner.temp }}/vercel.json
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: bun e2e/csp/check-deployed-headers.ts
