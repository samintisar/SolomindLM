# Deletes Convex preview deployments once their branch is done, so they stop counting
# against the team's deployment quota (40). A full quota fails every new Vercel preview
# with DeploymentQuotaReached (see .github/BRANCHING.md, "PR previews").
#
# - A PR closes (merged or not): delete the preview built from its branch.
# - Daily and on demand: delete every preview whose branch no longer exists. main deletes
#   merged branches, so this catches previews whose close event was missed (a fork or
#   Dependabot PR gets no secrets) and previews of branches pushed without a PR.
#
# Auth: CONVEX_TEAM_ACCESS_TOKEN, a Convex team access token (team settings → Access
# Tokens). The preview deploy key can delete previews but can't list them.

name: Convex preview cleanup

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "30 6 * * *" # daily 06:30 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only print what would be deleted
        type: boolean
        default: false

concurrency:
  group: convex-preview-cleanup-${{ github.event.pull_request.number || 'sweep' }}

permissions:
  contents: read

env:
  CONVEX_TEAM_SLUG: samin-intisar
  CONVEX_PROJECT_SLUG: solomindlm

jobs:
  cleanup:
    name: Delete finished Convex previews
    # Fork PRs get no secrets on pull_request events; the daily sweep covers them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Delete the closed PR's preview
        if: github.event_name == 'pull_request'
        env:
          CONVEX_TEAM_ACCESS_TOKEN: ${{ secrets.CONVEX_TEAM_ACCESS_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bun scripts/cleanup-convex-previews.ts --branch "$BRANCH"

      - name: Delete previews of deleted branches
        if: github.event_name != 'pull_request'
        env:
          CONVEX_TEAM_ACCESS_TOKEN: ${{ secrets.CONVEX_TEAM_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          LIVE_BRANCHES=$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name')
          export LIVE_BRANCHES
          if [ "$DRY_RUN" = "true" ]; then set -- --dry-run; fi
          bun scripts/cleanup-convex-previews.ts --sweep "$@"
