# Self-hosted Renovate — runs Renovate on GitHub Actions (no Mend-hosted app installed).
#
# `RENOVATE_TOKEN` = a fine-grained PAT stored as a repo secret, with these scopes:
#   - Contents: write          (branches / lockfile updates)
#   - Pull requests: write     (open & update PRs)
#   - Workflows: write         (required by `helpers:pinGitHubActionDigests` to edit workflow files)
#   - Issues: write            (Dependency Dashboard issue + auto-created `dependencies` / `security` labels)
#   - Dependabot alerts: read  (for `vulnerabilityAlerts`; repo must have Dependabot alerts enabled)
# The job's own GITHUB_TOKEN stays read-only; all write scope is carried by RENOVATE_TOKEN.
#
# Alternative: a GitHub App — but an App installation token is 1-hour-lived and cannot be a static
# secret, so it must be minted per run via `actions/create-github-app-token` and passed to `token:`.
#
# Runs Monday 13:00 UTC (fixed; does not track DST); trigger manually via workflow_dispatch.

name: Renovate

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
