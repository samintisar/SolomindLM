# Syncs .github/labels.yml to the repo's issue labels.
# Runs on merge to main when the manifest changes, and on demand.
# delete-other-labels is left at its default (false): labels not in the
# manifest (e.g. GitHub's built-ins) are preserved.

name: Sync labels

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sync-labels
  cancel-in-progress: true

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Apply label manifest
        uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2.3.3
        with:
          config-file: .github/labels.yml
