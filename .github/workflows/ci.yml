# PR: typecheck + Vite build (placeholder Convex URL).
# main: typecheck + production web build only. Convex deploy runs on Vercel Production only —
# running `convex deploy` here and on Vercel at the same time causes 409 ExistingModuleHashConflict.
# Set repo variable VITE_CONVEX_URL to prod https://….convex.cloud (same as after deploy). See README.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for every job's GITHUB_TOKEN: jobs only check out code.
# actions/cache and upload-artifact use the runtime token, not this one.
# A job that needs more must declare its own `permissions:` block.
permissions:
  contents: read

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  typecheck-convex:
    name: Typecheck (Convex)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Assert Vercel build runs convex deploy
        run: |
          # Preview vs production is routed by the CONVEX_DEPLOY_KEY scope in Vercel
          # (a preview key targets an isolated per-branch preview deployment and
          # cannot deploy to prod), not by the build command. See
          # docs/superpowers/specs/2026-09-08-convex-preview-spike-outcome.md
          if ! grep -qF 'convex deploy' apps/web/vercel.json; then
            echo "::error::apps/web/vercel.json buildCommand must run 'convex deploy' so Convex and the Vite bundle deploy together"
            exit 1
          fi
          if ! grep -qF 'cmd-url-env-var-name VITE_CONVEX_URL' apps/web/vercel.json; then
            echo "::error::convex deploy must pass --cmd-url-env-var-name VITE_CONVEX_URL so the built bundle targets the deployment it just pushed to"
            exit 1
          fi

      - name: Typecheck Convex
        run: bun run typecheck:convex

  typecheck-web:
    name: Typecheck (Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Typecheck Web
        run: bun run typecheck:web

  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Biome check
        run: bun run lint -- --diagnostic-level=error

      - name: Design-system lint (shadcn/lint ratchet)
        run: bun run lint:design

  workflow-lint:
    name: Lint (Workflows)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  audit:
    name: Dependency audit (baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Separate job (not a step in `lint`) so the repo's Bun pin (package.json
      # packageManager, consumed by ./.github/actions/setup) stays untouched.
      # `bun audit` landed after Bun 1.2.2, so this job runs a newer Bun.
      # Keep >= package.json "packageManager"; bun audit was added after 1.2.2.
      - name: Setup Bun (audit)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Restore dependency cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency audit (baseline — non-blocking)
        continue-on-error: true
        run: |
          set -o pipefail
          echo "## bun audit (baseline — non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Wrap in `timeout` — `bun audit` can hang on registry stalls; a stall
          # should degrade to a warning, not burn the job's whole time budget.
          if timeout 300 bun audit --audit-level=high 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "No advisories at or above 'high'." >> "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            if [ "$code" -eq 124 ]; then
              echo "::warning::bun audit timed out after 300s — skipped this run. Baseline is non-blocking."
            else
              echo "::warning::bun audit reported advisories at or above 'high' — see the job summary. Baseline is non-blocking; tighten in a follow-up."
            fi
          fi

  knip:
    name: Knip (unused code, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory until the baseline is clean: findings go to the job summary and
    # never fail the PR (--no-exit-code); continue-on-error keeps a Knip crash
    # or config error from blocking either.
    continue-on-error: true
    permissions:
      contents: read
    env:
      # vitest.convex.config.ts calls dotenv, which Knip loads; keep its banner
      # out of the markdown report.
      DOTENV_CONFIG_QUIET: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Knip loads repo config files (vitest/vite/playwright configs);
          # nothing here needs the token after checkout.
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      # Default mode includes tests: covers devDependencies and test helpers.
      # convex-test's import.meta.glob("/convex/**/*.ts") marks every Convex
      # module as used here, so Convex dead code only shows in the next step.
      - name: Knip (default mode)
        continue-on-error: true
        run: |
          {
            echo "## Knip — default mode"
            bun run knip --no-exit-code --reporter markdown
          } >> "$GITHUB_STEP_SUMMARY"

      # Production mode skips tests (and the glob above): finds dead Convex
      # code and code only reachable from tests.
      - name: Knip (production mode)
        continue-on-error: true
        run: |
          {
            echo "## Knip — production mode"
            bun run knip:production --no-exit-code --reporter markdown
          } >> "$GITHUB_STEP_SUMMARY"

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run Convex Tests
        env:
          # No TAVILY_API_KEY: test:convex does not need it (env.ts defaults to ""),
          # and providing it flips on describeIfKey blocks in DiscoveryService.test.ts
          # that make live Tavily / academic-search API calls. Keep the suite hermetic.
          TOGETHER_AI_API_KEY: test-key-for-ci
        run: bun run test:convex

      - name: Run Web Tests
        run: bun run test:web

      - name: RAG eval fixture dry-run
        run: bun run eval:rag:dry

      - name: Use-case eval packs dry-run
        run: bun run eval:usecases:dry

  # Runs the web suite a second time (also in test-unit) to produce the coverage
  # floor. Fold the web run out of test-unit once "Coverage Report" is a required
  # check (see branch-protection follow-up in the Phase 4 plan).
  test-coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate Coverage
        run: bun run test:web:coverage

      - name: Upload Coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: apps/web/coverage/

  typecheck-mobile:
    name: Typecheck (Expo mobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Typecheck mobile
        run: bun run typecheck:mobile

  test-mobile:
    name: Test (Mobile)
    runs-on: ubuntu-latest
    # Jest is prone to not exiting on open handles (a hanging teardown, not
    # just a failing assertion) — see the dead scaffold test this suite
    # replaced. Bound it like `audit` bounds its own hang-prone tool.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run mobile tests
        run: bun run test:mobile

  publish-mobile-update:
    name: Publish mobile OTA update
    needs: [typecheck-mobile, test-mobile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        id: expo_token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::warning::EXPO_TOKEN repo secret is not set — mobile OTA publish skipped. Generate a robot access token at expo.dev (Account Settings > Access Tokens) and add it as a repo secret named EXPO_TOKEN to enable."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.expo_token.outputs.run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        if: steps.expo_token.outputs.run == 'true'
        uses: ./.github/actions/setup

      # runtimeVersion.policy is "appVersion" (app.json), so this update only
      # reaches installed binaries whose native `version` matches — an OTA
      # push can never land on a build with incompatible native code.
      - name: Publish update (production channel)
        if: steps.expo_token.outputs.run == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Passed through an env var, not interpolated into the script directly —
          # a commit message is attacker-controllable and could break out of an
          # inline `${{ }}` expression (see actionlint's "expression" rule).
          UPDATE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          bun x eas-cli update \
            --channel production \
            --environment production \
            --non-interactive \
            --message "$UPDATE_MESSAGE"

  build-web:
    name: Build (Web, PR parity)
    needs: [typecheck-convex, typecheck-web, typecheck-mobile]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Web
        env:
          VITE_CONVEX_URL: "https://ci-placeholder.convex.cloud"
        run: bun run --filter @solomindlm/web build

  build-web-main:
    name: Build web (main, prod Convex URL — no deploy)
    needs: [typecheck-convex, typecheck-web, typecheck-mobile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build web (parity with Vite step after Vercel convex deploy)
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        run: |
          if [ -z "${VITE_CONVEX_URL}" ]; then
            echo "::error::Set repository variable VITE_CONVEX_URL to your production Convex URL (https://….convex.cloud). CI must not run convex deploy on main alongside Vercel — that causes Convex 409 ExistingModuleHashConflict."
            exit 1
          fi
          bun run build:prod

  test-e2e:
    name: E2E Tests (${{ matrix.shard }}/${{ strategy.matrix.total }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        total: [2]
        shard: [1, 2]
    steps:
      - name: Check for E2E secrets
        id: e2e_secrets
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          if [ -z "${E2E_TEST_EMAIL}" ] || [ -z "${E2E_TEST_PASSWORD}" ]; then
            echo "::warning::E2E_TEST_EMAIL / E2E_TEST_PASSWORD repo secrets are not set — E2E suite skipped. Phase 3 wires E2E to the Vercel preview deployment."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.e2e_secrets.outputs.run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        if: steps.e2e_secrets.outputs.run == 'true'
        uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        id: pw-cache
        if: steps.e2e_secrets.outputs.run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        if: steps.e2e_secrets.outputs.run == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.e2e_secrets.outputs.run == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run E2E tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        if: steps.e2e_secrets.outputs.run == 'true'
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: bunx playwright test --shard=${{ matrix.shard }}/${{ matrix.total }}

      - name: Upload test results
        if: failure() && steps.e2e_secrets.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-results-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/

  design-changes:
    name: Detect design-system changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # paths-filter lists a PR's changed files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      design: ${{ steps.filter.outputs.design }}
    steps:
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            design:
              - 'apps/web/src/shared/components/ui/**'
              - 'apps/web/src/index.css'
              - 'apps/web/src/dev/**'
              - 'e2e/design/**'
              - 'playwright.design.config.ts'
              - 'scripts/design-snapshots.sh'

  # Screenshot baselines for every ui primitive (/dev/design gallery). Runs in the same
  # Playwright image as `bun run test:design`, so renders match the committed Linux PNGs.
  # Keep the image tag equal to the @playwright/test version in bun.lock.
  design-snapshots:
    name: Design snapshots
    needs: design-changes
    if: needs.design-changes.outputs.design == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # setup-bun extracts a zip; the Playwright image ships without unzip.
      - name: Install unzip
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip

      - name: Setup
        uses: ./.github/actions/setup

      - name: Screenshot tests
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        run: |
          if [ -z "${VITE_CONVEX_URL}" ]; then
            echo "::error::Set repository variable VITE_CONVEX_URL; the gallery build needs it."
            exit 1
          fi
          bunx playwright test -c playwright.design.config.ts

      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-snapshots-diffs
          path: test-results/
