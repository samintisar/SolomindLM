# PR: typecheck + Vite build (placeholder Convex URL).
# main: typecheck + production web build only. Convex deploy runs on Vercel Production only —
# running `convex deploy` here and on Vercel at the same time causes 409 ExistingModuleHashConflict.
# Set repo variable VITE_CONVEX_URL to prod https://….convex.cloud (same as after deploy). See README.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  typecheck-convex:
    name: Typecheck (Convex)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Assert Vercel production build runs convex deploy
        run: |
          if ! grep -qF 'convex deploy' apps/web/vercel.json; then
            echo "::error::apps/web/vercel.json buildCommand must include convex deploy for non-preview, or production Convex and Vite can drift"
            exit 1
          fi
          if ! grep -qF 'VERCEL_ENV' apps/web/vercel.json; then
            echo "::error::buildCommand should branch on VERCEL_ENV (preview = build only, else = convex deploy + build)"
            exit 1
          fi
          if ! grep -qF 'preview' apps/web/vercel.json; then
            echo "::error::buildCommand should keep preview on build-only to avoid preview overwriting prod Convex"
            exit 1
          fi

      - name: Typecheck Convex
        run: bun run typecheck:convex

  typecheck-web:
    name: Typecheck (Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Typecheck Web
        run: bun run typecheck:web

  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Biome check
        run: bun run lint -- --diagnostic-level=error

  workflow-lint:
    name: Lint (Workflows)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run Convex Tests
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TOGETHER_AI_API_KEY: test-key-for-ci
        run: bun run test:convex

      - name: Run Web Tests
        run: bun run test:web

      - name: RAG eval fixture dry-run
        run: bun run eval:rag:dry

  test-coverage:
    name: Coverage Report
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate Coverage
        run: bun run test:web:coverage

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/web/coverage/

  typecheck-mobile:
    name: Typecheck (Expo mobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Typecheck mobile
        run: bun run typecheck:mobile

  build-web:
    name: Build (Web, PR parity)
    needs: [typecheck-convex, typecheck-web, typecheck-mobile]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Web
        env:
          VITE_CONVEX_URL: "https://ci-placeholder.convex.cloud"
        run: bun run --filter @solomindlm/web build

  build-web-main:
    name: Build web (main, prod Convex URL — no deploy)
    needs: [typecheck-convex, typecheck-web, typecheck-mobile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build web (parity with Vite step after Vercel convex deploy)
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        run: |
          if [ -z "${VITE_CONVEX_URL}" ]; then
            echo "::error::Set repository variable VITE_CONVEX_URL to your production Convex URL (https://….convex.cloud). CI must not run convex deploy on main alongside Vercel — that causes Convex 409 ExistingModuleHashConflict."
            exit 1
          fi
          bun run build:prod

  test-e2e:
    name: E2E Tests (${{ matrix.shard }}/${{ strategy.matrix.total }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        total: [2]
        shard: [1, 2]
    steps:
      - name: Check for E2E secrets
        id: e2e_secrets
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          if [ -z "${E2E_TEST_EMAIL}" ] || [ -z "${E2E_TEST_PASSWORD}" ]; then
            echo "::warning::E2E_TEST_EMAIL / E2E_TEST_PASSWORD repo secrets are not set — E2E suite skipped. Phase 3 wires E2E to the Vercel preview deployment."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.e2e_secrets.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup
        if: steps.e2e_secrets.outputs.run == 'true'
        uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        id: pw-cache
        if: steps.e2e_secrets.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        if: steps.e2e_secrets.outputs.run == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.e2e_secrets.outputs.run == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run E2E tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        if: steps.e2e_secrets.outputs.run == 'true'
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: bunx playwright test --shard=${{ matrix.shard }}/${{ matrix.total }}

      - name: Upload test results
        if: failure() && steps.e2e_secrets.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
