# Nightly live RAG eval: smoke split with repeats, the use-case packs, and a trend check against
# the stored history. Needs three repo secrets; without them the job logs a notice and does nothing.
# PR CI stays dry-run only (ci.yml runs eval:rag:dry and eval:usecases:dry).
#
# Results are appended to evals/rag/history/*.jsonl and committed back to main by the last steps.

name: Eval nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      repeats:
        description: "Runs per smoke fixture (pass^k and flaky verdicts)"
        required: false
        default: "3"
        type: string

# One nightly at a time: the history commit must not race a second run.
concurrency:
  group: eval-nightly
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  live-smoke:
    name: Live smoke and trend
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Writes the history commit back to main (see the commit step).
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the rebase before the history push has main to rebase onto.
          fetch-depth: 0

      # Same secrets gate as the e2e job in ci.yml: skip the job's work, not the job.
      - name: Check for eval secrets
        id: gate
        env:
          RAG_EVAL_CONVEX_URL: ${{ secrets.RAG_EVAL_CONVEX_URL }}
          RAG_EVAL_SECRET: ${{ secrets.RAG_EVAL_SECRET }}
          TOGETHER_AI_API_KEY: ${{ secrets.TOGETHER_AI_API_KEY }}
        run: |
          if [ -z "${RAG_EVAL_CONVEX_URL}" ] || [ -z "${RAG_EVAL_SECRET}" ] || [ -z "${TOGETHER_AI_API_KEY}" ]; then
            echo "::notice::Nightly live eval skipped: set the RAG_EVAL_CONVEX_URL, RAG_EVAL_SECRET and TOGETHER_AI_API_KEY repo secrets to enable it."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.gate.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Restore dependency cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: bun install --frozen-lockfile

      # The smoke split runs each fixture `repeats` times; a red run still appends its history rows.
      - name: Smoke (live, repeats)
        id: smoke
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          RAG_EVAL_CONVEX_URL: ${{ secrets.RAG_EVAL_CONVEX_URL }}
          RAG_EVAL_SECRET: ${{ secrets.RAG_EVAL_SECRET }}
          TOGETHER_AI_API_KEY: ${{ secrets.TOGETHER_AI_API_KEY }}
          CI: "true"
          REPEATS: ${{ inputs.repeats || '3' }}
        run: |
          bun run eval:rag:smoke -- --repeats "$REPEATS" \
            --output evals/rag/generated/nightly-smoke.json \
            --export-artifacts --artifacts-dir evals/rag/generated/nightly-smoke \
            --append-history

      - name: Use-case packs (live)
        id: usecases
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          RAG_EVAL_CONVEX_URL: ${{ secrets.RAG_EVAL_CONVEX_URL }}
          RAG_EVAL_SECRET: ${{ secrets.RAG_EVAL_SECRET }}
          TOGETHER_AI_API_KEY: ${{ secrets.TOGETHER_AI_API_KEY }}
          CI: "true"
        run: |
          bun run eval:usecases -- --output evals/rag/generated/nightly-usecases.json --append-history

      # Exit 1 when any metric's latest run is a new fail. Output is kept for the summary.
      - name: Trend (new fails vs previous run)
        id: trend
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p evals/rag/generated
          bun run eval:trend -- --split smoke --check | tee evals/rag/generated/nightly-trend.txt

      - name: Upload nightly outputs
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-nightly-${{ github.run_id }}
          path: |
            evals/rag/generated/nightly-*.json
            evals/rag/generated/nightly-smoke/
            evals/rag/generated/nightly-trend.txt
          retention-days: 30
          if-no-files-found: warn

      # Only pushes from main: a manual run on a feature branch must not write history to main.
      - name: Commit history to main
        if: always() && steps.gate.outputs.run == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evals/rag/history
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          git commit -m "chore(evals): nightly history $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Summary and result
        if: always() && steps.gate.outputs.run == 'true'
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          USECASES_OUTCOME: ${{ steps.usecases.outcome }}
          TREND_OUTCOME: ${{ steps.trend.outcome }}
          REPEATS: ${{ inputs.repeats || '3' }}
        run: |
          {
            echo "## Nightly live eval"
            echo ""
            echo "| Step | Outcome |"
            echo "| --- | --- |"
            echo "| Smoke (repeats ${REPEATS}) | ${SMOKE_OUTCOME} |"
            echo "| Use-case packs | ${USECASES_OUTCOME} |"
            echo "| Trend (new fails) | ${TREND_OUTCOME} |"
            echo ""
            echo "### Trend (smoke)"
            echo ""
            echo '```'
            cat evals/rag/generated/nightly-trend.txt 2>/dev/null || echo "(no trend output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SMOKE_OUTCOME" = "failure" ] || [ "$USECASES_OUTCOME" = "failure" ] || [ "$TREND_OUTCOME" = "failure" ]; then
            echo "::error::Nightly eval failed: smoke=${SMOKE_OUTCOME}, usecases=${USECASES_OUTCOME}, trend=${TREND_OUTCOME}"
            exit 1
          fi
