# After Vercel finishes a production deployment, tell IndexNow (Bing and the other engines that
# share it) which public URLs changed. apps/web/scripts/indexnow-post-deploy.ts diffs the previous
# production deployment's sitemap.xml against the new one, so only added, removed, or re-dated
# pages are submitted, and only once they are live.
#
# Both deployments are immutable, so if this fails (an IndexNow 429, a sitemap fetch timing out),
# re-run the job: it diffs the same two deployments again. A failure never blocks the deploy.
#
# Secrets:
# - INDEXNOW_KEY (repo secret): the same key as the Vercel env var that writes /{key}.txt during
#   the build. Without it the job warns and skips.
# - VERCEL_AUTOMATION_BYPASS_SECRET on the `vercel-preview-bypass` environment: per-deployment
#   URLs sit behind Deployment Protection (see deployed-headers.yml). The script only sends it
#   over HTTPS to www.solomindlm.com and this project's *.vercel.app URLs.
#
# The script is checked out from main, not from the deployed commit.

name: IndexNow

on:
  deployment_status:

permissions:
  contents: read
  deployments: read

jobs:
  submit:
    name: Submit changed URLs to IndexNow
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: vercel-preview-bypass
    steps:
      - name: Check for secrets
        id: secrets
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          missing=""
          if [ -z "${INDEXNOW_KEY}" ]; then missing="INDEXNOW_KEY (repo secret)"; fi
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET}" ]; then
            missing="${missing:+${missing}, }VERCEL_AUTOMATION_BYPASS_SECRET (vercel-preview-bypass environment)"
          fi
          if [ -n "${missing}" ]; then
            echo "::warning::Not set: ${missing}. Skipping IndexNow submission."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main
        if: steps.secrets.outputs.run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # The script only uses fetch and relative imports, so no dependency install.
      - name: Setup Bun
        if: steps.secrets.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Submit changed URLs
        if: steps.secrets.outputs.run == 'true'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun apps/web/scripts/indexnow-post-deploy.ts
